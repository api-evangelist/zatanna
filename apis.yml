aid: zatanna
name: Zatanna
description: >-
  Zatanna is a Y Combinator (W2026) startup based in San Francisco that creates
  APIs for software that doesn't have any. It reverse-engineers the back ends of
  web-based cloud and on-prem software — ERPs (SAP), PMS/POS systems, insurance
  portals, and marketplaces — by observing real workflows, reconstructing the
  underlying request sequences, and hosting them as clean, callable APIs. Rather
  than relying on slow browser automation or computer-use agents, Zatanna gives
  AI agents faster, cheaper, and more reliable integrations, with a reliability
  layer that handles session management, authentication, and change detection.
  The agent-facing surface is a hosted, OAuth-protected Model Context Protocol
  (MCP) server at api.zatanna.ai.
